[tox]
requires =
    tox>=4.22
    tox-uv>=1.13
envlist =
    py311-django52
    py{312,313,314}-django{52,60,61}
    lint
    typecheck

[testenv]
# uv-venv-runner (not the lock runner): the Django pin below must win over the
# version resolved in uv.lock.
runner = uv-venv-runner
dependency_groups = test
setenv =
    PYTHONPATH = {toxinidir}
commands =
    coverage run --source vinta_orgs,vinta_orgs_custom_data runtests.py {posargs}
    # The same suite again, against a project that replaced both swappable
    # models. Nothing about the library may depend on which one is configured,
    # and running it is the only way to know. ``--append`` so the two runs share
    # one coverage report.
    coverage run --append --source vinta_orgs,vinta_orgs_custom_data runtests.py \
        --settings=tests.settings_swapped {posargs}
    coverage report -m
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

[testenv:lint]
runner = uv-venv-runner
dependency_groups = dev
skip_install = true
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
runner = uv-venv-runner
dependency_groups = dev
# Not skip_install: the django-stubs plugin imports `tests.settings` and needs
# the app registry, so the package has to be importable.
setenv =
    PYTHONPATH = {toxinidir}
commands =
    mypy
